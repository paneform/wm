<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Paneform WM, every window in its place</title>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#191724"/>
      <stop offset="1" stop-color="#26233a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop stop-color="#ebbcba" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ebbcba" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#110f19" flood-opacity=".55"/>
    </filter>
    <clipPath id="mark"><rect x="0" y="0" width="152" height="152" rx="30"/></clipPath>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="982" cy="113" r="430" fill="url(#glow)"/>
  <path d="M0 560C210 515 326 598 523 557s338-123 677-58v131H0Z" fill="#1f1d2e"/>

  <g transform="translate(84 76)">
    <g transform="scale(.4)">
      <rect width="152" height="152" rx="30" fill="#26233a"/>
      <rect width="152" height="28" fill="#6e6a86" clip-path="url(#mark)"/>
      <rect x="14" y="42" width="58" height="96" rx="12" fill="#e0def4"/>
      <rect x="78" y="42" width="60" height="56" rx="12" fill="#ebbcba"/>
      <rect x="78" y="104" width="60" height="34" rx="12" fill="#e0def4"/>
    </g>
    <text x="78" y="48" fill="#e0def4" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="650" letter-spacing="-1.5">paneform</text>
    <text x="269" y="48" fill="#908caa" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="500" letter-spacing="-1">wm</text>
  </g>

  <g transform="translate(84 236)">
    <text fill="#e0def4" font-family="Inter, Arial, sans-serif" font-size="67" font-weight="650" letter-spacing="-3">
      <tspan x="0" y="0">Every window</tspan>
      <tspan x="0" y="76">in its </tspan><tspan fill="#ebbcba">place.</tspan>
    </text>
    <text x="2" y="191" fill="#908caa" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="450">A reliability-first tiling window manager for macOS.</text>
  </g>

  <g transform="translate(795 111) rotate(3 142 193)" filter="url(#shadow)">
    <rect width="292" height="398" rx="30" fill="#15131e" stroke="#6e6a86" stroke-width="2"/>
    <circle cx="25" cy="21" r="5" fill="#eb6f92"/><circle cx="43" cy="21" r="5" fill="#f6c177"/><circle cx="61" cy="21" r="5" fill="#9ccfd8"/>
    <rect x="18" y="44" width="112" height="334" rx="14" fill="#6e6a86"/>
    <rect x="142" y="44" width="132" height="195" rx="14" fill="#ebbcba"/>
    <rect x="142" y="251" width="132" height="127" rx="14" fill="#908caa"/>
    <rect x="159" y="65" width="76" height="8" rx="4" fill="#26233a" opacity=".55"/>
    <rect x="159" y="83" width="96" height="8" rx="4" fill="#26233a" opacity=".28"/>
  </g>
</svg>
