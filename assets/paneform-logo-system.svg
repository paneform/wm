<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-labelledby="title desc">
  <title id="title">Paneform suite logo system</title>
  <desc id="desc">Paneform, WM, Bar, and Relay marks shown as a cohesive family.</desc>
  <style>:root{--pf-black:#26233a;--pf-white:#e0def4;--pf-cyan:#ebbcba;--pf-bright-black:#6e6a86;--pf-pane:#6e6a86;--pf-accent:#ebbcba}@media(prefers-color-scheme:light){:root{--pf-black:#f2e9e1;--pf-white:#575279;--pf-cyan:#d7827e;--pf-bright-black:#9893a5;--pf-pane:#575279;--pf-accent:#d7827e}}</style>
  <defs><clipPath id="preview-icon-clip"><rect width="120" height="120" rx="15"/></clipPath></defs>
  <rect width="800" height="260" rx="24" fill="var(--ansi-white, var(--pf-white))"/>
  <g transform="translate(48 50)"><rect width="120" height="120" rx="15" fill="var(--ansi-black, var(--pf-black))"/><rect width="120" height="15" fill="var(--ansi-white, var(--pf-white))" clip-path="url(#preview-icon-clip)"/><rect x="11" y="26" width="47" height="83" rx="9" fill="var(--ansi-white, var(--pf-white))"/><rect x="62" y="26" width="47" height="47" rx="9" fill="var(--ansi-white, var(--pf-white))"/><rect x="62" y="77" width="47" height="32" rx="9" fill="var(--ansi-white, var(--pf-white))"/></g>
  <g transform="translate(232 50)"><rect width="120" height="120" rx="15" fill="var(--ansi-black, var(--pf-black))"/><rect width="120" height="15" fill="var(--paneform-pane, var(--ansi-bright-black, var(--pf-pane)))" clip-path="url(#preview-icon-clip)"/><rect x="11" y="26" width="47" height="83" rx="9" fill="var(--paneform-pane, var(--ansi-bright-black, var(--pf-pane)))"/><rect x="62" y="26" width="47" height="47" rx="9" fill="var(--paneform-accent, var(--ansi-cyan, var(--pf-accent)))"/><rect x="62" y="77" width="47" height="32" rx="9" fill="var(--paneform-pane, var(--ansi-bright-black, var(--pf-pane)))"/></g>
  <g transform="translate(416 50)"><rect width="120" height="120" rx="15" fill="var(--ansi-black, var(--pf-black))"/><rect width="120" height="15" fill="var(--ansi-cyan, var(--pf-cyan))" clip-path="url(#preview-icon-clip)"/><rect x="11" y="26" width="47" height="83" rx="9" fill="var(--ansi-white, var(--pf-white))"/><rect x="62" y="26" width="47" height="47" rx="9" fill="var(--ansi-white, var(--pf-white))"/><rect x="62" y="77" width="47" height="32" rx="9" fill="var(--ansi-white, var(--pf-white))"/></g>
  <g transform="translate(600 50)"><rect width="120" height="120" rx="15" fill="var(--ansi-black, var(--pf-black))"/><rect x="11" y="13" width="98" height="38" rx="9" fill="var(--ansi-white, var(--pf-white))"/><rect x="11" y="69" width="98" height="38" rx="9" fill="var(--ansi-white, var(--pf-white))"/><path d="M60 51v18" stroke="var(--ansi-cyan, var(--pf-cyan))" stroke-width="11"/><circle cx="60" cy="51" r="7.5" fill="var(--ansi-cyan, var(--pf-cyan))"/><circle cx="60" cy="69" r="7.5" fill="var(--ansi-cyan, var(--pf-cyan))"/></g>
  <g fill="var(--ansi-black, var(--pf-black))" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle"><text x="108" y="211" font-size="22" font-weight="650">Paneform</text><text x="292" y="211" font-size="22" font-weight="650">WM</text><text x="476" y="211" font-size="22" font-weight="650">Bar</text><text x="660" y="211" font-size="22" font-weight="650">Relay</text></g>
</svg>
