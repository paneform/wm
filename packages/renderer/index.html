<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wm renderer — simulated platform</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header id="topbar">
      <strong>wm · engine visualizer</strong>
      <span class="badge h-healthy" id="top-health">starting</span>
      <span class="badge" id="top-paused">running</span>
      <span id="top-epoch">epoch —</span>
      <span class="spacer"></span>
      <button id="top-refresh" title="Pull committed state and redraw">refresh</button>
    </header>
    <main id="canvas-wrap">
      <canvas id="stage"></canvas>
      <div id="hint">wheel = zoom · drag = pan · click = select window</div>
    </main>
    <!-- side panels (#side) are mounted here by main.ts -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
